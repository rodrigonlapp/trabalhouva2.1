<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel de Controle - Hub Brasil</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Montserrat', sans-serif;
            background: #f1f3f6;
            color: #333;
            padding: 30px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 25px 35px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h2 { margin-bottom: 20px; font-size: 22px; color: #1a1a1a; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; }
        input[type="text"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }
        .color-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .color-item {
            background: #fafafa;
            padding: 10px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
        }
        .color-item input[type="color"] {
            width: 100%;
            height: 38px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background: none;
        }
        .acoes {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }
        button {
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 700;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-salvar { background: #27ae60; color: #fff; }
        .btn-salvar:hover { background: #219150; }
        .btn-abrir { background: #2980b9; color: #fff; text-decoration: none; display: inline-flex; align-items: center; }
        .btn-abrir:hover { background: #1f6391; }
        .aviso { font-size: 12px; color: #777; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Configuração do Cardápio Impresso (Hub Brasil)</h2>

    <div class="form-group">
        <label for="tipoLayout">Modelo do Cardápio:</label>
        <select id="tipoLayout">
            <option value="modelo2">Modelo 2 - Faixas & Colunas (Lanchonete/Pizzaria)</option>
            <option value="modelo1">Modelo 1 - Flyer Visual (Sorveteria/Açaí/Sobremesas)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="nomeEstabelecimento">Nome da Loja / Título:</label>
        <input type="text" id="nomeEstabelecimento" value="MEU ESTABELECIMENTO">
    </div>

    <div class="form-group">
        <label for="contatoWhats">WhatsApp / Contato:</label>
        <input type="text" id="contatoWhats" value="(21) 99999-9999">
    </div>

    <label>Identidade Visual & Cores:</label>
    <div class="color-grid">
        <div class="color-item">
            <label>Cor Principal (Tarjas):</label>
            <input type="color" id="corPrimaria" value="#f4b800">
        </div>
        <div class="color-item">
            <label>Texto das Tarjas:</label>
            <input type="color" id="corSecundaria" value="#222222">
        </div>
        <div class="color-item">
            <label>Fundo da Folha:</label>
            <input type="color" id="corFundo" value="#ffffff">
        </div>
    </div>

    <div class="acoes">
        <button class="btn-salvar" onclick="salvarConfiguracoes()">Salvar Configurações</button>
        <a href="teste.html" target="_blank" class="btn-abrir" style="padding: 12px 24px; border-radius: 5px; font-weight: 700;">Abrir Cardápio / Imprimir</a>
    </div>

    <p class="aviso">* Ao clicar em salvar, os dados são salvos localmente e aplicados instantaneamente ao arquivo <code>teste.html</code>.</p>
</div>

<script>
    function carregarConfiguracoes() {
        const config = JSON.parse(localStorage.getItem('hubCardapioConfig')) || {};
        if (config.modelo) document.getElementById('tipoLayout').value = config.modelo;
        if (config.nome) document.getElementById('nomeEstabelecimento').value = config.nome;
        if (config.contato) document.getElementById('contatoWhats').value = config.contato;
        if (config.primaria) document.getElementById('corPrimaria').value = config.primaria;
        if (config.secundaria) document.getElementById('corSecundaria').value = config.secundaria;
        if (config.fundo) document.getElementById('corFundo').value = config.fundo;
    }

    function salvarConfiguracoes() {
        const config = {
            modelo: document.getElementById('tipoLayout').value,
            nome: document.getElementById('nomeEstabelecimento').value,
            contato: document.getElementById('contatoWhats').value,
            primaria: document.getElementById('corPrimaria').value,
            secundaria: document.getElementById('corSecundaria').value,
            fundo: document.getElementById('corFundo').value
        };
        localStorage.setItem('hubCardapioConfig', JSON.stringify(config));
        alert('Configurações salvas! Clique em "Abrir Cardápio / Imprimir" para visualizar.');
    }

    window.onload = carregarConfiguracoes;
</script>

</body>
</html>
